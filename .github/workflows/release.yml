name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: bash scripts/test-install.sh
      - run: bash scripts/build-release.sh
      - name: Publish binaries and installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/cmsg-* dist/SHA256SUMS install.sh
